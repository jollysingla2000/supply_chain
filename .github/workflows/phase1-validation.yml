name: Phase 1 Data Assurance Checks

on:
  push:
    branches:
      - "phase1/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/phase1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run engine tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build
