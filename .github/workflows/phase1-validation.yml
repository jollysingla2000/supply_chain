name: Phase 1 Data Assurance Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"
      - "docs/**"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"
      - "docs/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Test dependency-audit failure-path handling
        run: node scripts/test-dependency-audit.mjs

      - name: Validate local Markdown links
        run: node scripts/check-doc-links.mjs

      - name: Report dependency audit findings
        run: bash scripts/run-dependency-audit.sh

      - name: Run engine tests with line, branch, and function coverage
        run: |
          set -euo pipefail
          rm -rf coverage/v8
          mkdir -p coverage/v8
          NODE_V8_COVERAGE=coverage/v8 npm run test:coverage 2>&1 | tee coverage/engine-test-coverage.txt
          node scripts/report-capability-coverage.mjs | tee coverage/capability-coverage.txt

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload verification and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-verification-${{ github.sha }}
          path: |
            npm-audit.json
            coverage/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
