name: Phase 1 Data Assurance Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Report dependency audit findings
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=low
          npm audit --json > npm-audit.json
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { console.log(name + ': severity=' + v.severity + ', direct=' + v.isDirect + ', range=' + v.range + ', fixAvailable=' + JSON.stringify(v.fixAvailable)); for (const x of v.via||[]) if (typeof x === 'object') console.log('  advisory=' + x.title + ', range=' + x.range + ', url=' + x.url); }"

      - name: Run engine tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
