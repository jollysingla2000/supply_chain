name: Phase 1 Data Assurance Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"
      - "docs/**"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/phase1-validation.yml"
      - "docs/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Report dependency audit findings
        run: |
          set -uo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          audit_exit=0
          npm audit --audit-level=low --json > npm-audit.json || audit_exit=$?
          node -e "const a=require('./npm-audit.json'); const vulns=Object.entries(a.vulnerabilities||{}); console.log('Dependency audit summary: ' + vulns.length + ' package advisory group(s)'); for (const [name,v] of vulns) { console.log(name + ': severity=' + v.severity + ', direct=' + v.isDirect + ', range=' + v.range + ', fixAvailable=' + JSON.stringify(v.fixAvailable)); for (const x of v.via||[]) if (typeof x === 'object') console.log('  advisory=' + x.title + ', range=' + x.range + ', url=' + x.url); }"
          exit "$audit_exit"

      - name: Run engine tests with line, branch, and function coverage
        run: |
          set -euo pipefail
          mkdir -p coverage/v8
          NODE_V8_COVERAGE=coverage/v8 npm run test:coverage 2>&1 | tee coverage/engine-test-coverage.txt

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload verification and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-verification-${{ github.sha }}
          path: |
            npm-audit.json
            coverage/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
